<!DOCTYPE html>
<html lang="es">

<head>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Horas de Trabajo v3.0</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript>
    <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-T296H3CG"
    height="0" width="0"
    style="display:none;visibility:hidden"></iframe>
    </noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div class="contenedor">
        <h1>📋 Mis Horas de Trabajo</h1>

        <!-- FORMULARIO -->
        <div class="formulario">
            <div class="campo campo-trabajo">
                <label for="trabajo">🏢 Trabajo / Empresa</label>
                <input type="text" id="trabajo" placeholder="Ej: Oficina, Reparto..." aria-label="Nombre del trabajo o empresa">
            </div>

            <div class="campo">
                <label for="fecha">Fecha</label>
                <input type="date" id="fecha" aria-label="Seleccionar fecha">
            </div>

            <div class="campo">
                <label for="horas">Horas trabajadas</label>
                <input type="text" id="horas" placeholder="Ej: 8:30" pattern="[0-9]+(:[0-5][0-9])?" aria-label="Horas trabajadas, formato horas:minutos">
            </div>

            <div class="campo">
                <label for="pago">Pago por hora (€)</label>
                <input type="number" id="pago" step="0.01" min="0" placeholder="Ej: 10" aria-label="Pago por hora en euros">
            </div>

            <button id="botonAgregar" aria-label="Agregar nuevo registro">➕ Agregar</button>
        </div>

        <!-- ENTRADA / SALIDA -->
        <div class="reloj">
            <button id="botonReloj" aria-label="Registrar entrada o salida">⏰ Entrada</button>
            <p id="estadoReloj">No has fichado hoy</p>
        </div>

        <div id="mensaje" role="status" aria-live="polite"></div>

        <button id="botonCopia" aria-label="Descargar copia de seguridad en JSON">💾 Descargar copia de seguridad</button>

        <input type="file" id="archivoRestaurar" accept=".json" style="display: none;" aria-hidden="true">

        <button id="botonRestaurar" aria-label="Restaurar copia de seguridad desde archivo">📂 Restaurar copia</button>

        <button id="botonExcel" aria-label="Exportar registros a Excel">📊 Exportar a Excel</button>

        <button id="botonTema" aria-label="Cambiar entre modo claro y oscuro">🌙</button>

        <!-- RESUMEN -->
        <div class="resumen">
            <div class="tarjeta">
                <h3>⏱️ Horas trabajadas</h3>
                <p id="totalHoras">0:00</p>
            </div>

            <div class="tarjeta">
                <h3>💰 Dinero ganado</h3>
                <p><span id="totalGeneral">0.00</span> €</p>
            </div>

            <div class="tarjeta">
                <h3>📅 Días trabajados</h3>
                <p id="totalDias">0</p>
            </div>
        </div>

        <!-- FILTRO -->
        <div class="filtro">
            <label for="filtroMes">📅 Mostrar mes:</label>
            <select id="filtroMes" aria-label="Filtrar registros por mes">
                <option value="todos">Todos los meses</option>
            </select>
        </div>

        <!-- TABLA -->
        <div class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th scope="col">Día</th>
                        <th scope="col">Fecha</th>
                        <th scope="col">Trabajo</th>
                        <th scope="col">Horas</th>
                        <th scope="col">Pago/hora</th>
                        <th scope="col">Total</th>
                        <th scope="col">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaRegistros"></tbody>
            </table>
        </div>
    </div>

    <!-- VERSIÓN -->
    <div class="version">v3.0</div>

    <script src="app.js"></script>
</body>

</html>
